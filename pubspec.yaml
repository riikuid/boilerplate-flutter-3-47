name: penta_crew
description: "Penta Crew — Flutter boilerplate (Cubit + UseCase + Repository, get_it, freezed)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State management & navigation
  flutter_bloc: ^9.1.1
  go_router: ^18.0.2

  # Network & logging
  dio: ^5.11.1
  talker_flutter: ^5.1.20
  talker_dio_logger: ^5.1.20

  # DI & storage
  get_it: ^9.3.0
  flutter_secure_storage: ^11.2.0

  # Models (codegen annotations)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Utilities
  intl: ^0.20.3
  toastification: ^3.2.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.6

  # Integrations — only imported under lib/integrations/
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.16.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  # Project tooling
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  change_app_package_name: ^1.5.0
  rename_app: ^1.6.6

flutter:
  uses-material-design: true
